<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b9bff"/>
      <stop offset="1" stop-color="#0a6cff"/>
    </linearGradient>
  </defs>
  <!-- 蓝色小人脸 -->
  <circle cx="128" cy="104" r="74" fill="url(#face)"/>
  <!-- 眼睛：macOS 风格短竖线 -->
  <line x1="103" y1="84" x2="103" y2="100" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <line x1="153" y1="84" x2="153" y2="100" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <!-- 鼻子：居中短竖线，比眼睛略细 -->
  <line x1="128" y1="104" x2="128" y2="116" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- 微笑：线条更细 -->
  <path d="M101 124 Q128 150 155 124" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- 底部蓝色短线（与 dock 指示同款） -->
  <rect x="84" y="212" width="88" height="14" rx="7" fill="#0a6cff"/>
</svg>